<!-- Hub: choose what to do -->
<div id="app-hub" class="app">
  <div class="hub-wrap">
    <h1>Que voulez-vous faire ?</h1>
    <p class="hub-sub">Commencez par trier et retoucher vos photos, puis créez un album ou un film avec celles que vous avez gardées.</p>
    <div class="hub-grid">
      <button class="hub-card" data-app="chooser">
        <span class="hub-step">1</span>
        <span class="hub-ico">🖼</span>
        <span class="hub-title">Trier &amp; retoucher</span>
        <span class="hub-desc">PhotoChooser : parcourir vos photos, garder les meilleures, les améliorer et les recadrer.</span>
        <span class="hub-meta" id="hub-chooser-meta"></span>
      </button>
      <button class="hub-card" data-app="album">
        <span class="hub-step">2</span>
        <span class="hub-ico">📖</span>
        <span class="hub-title">Créer un album</span>
        <span class="hub-desc">Mise en page automatique à partir de vos photos likées : chapitres, dates, légendes, thèmes. Tout reste modifiable.</span>
        <span class="hub-meta" id="hub-album-meta"></span>
      </button>
      <button class="hub-card" data-app="montage">
        <span class="hub-step">3</span>
        <span class="hub-ico">🎬</span>
        <span class="hub-title">Montage photo / vidéo</span>
        <span class="hub-desc">Un film monté automatiquement avec vos photos et vidéos likées : titres, mouvements, transitions, musique. Tout reste modifiable.</span>
        <span class="hub-meta" id="hub-montage-meta"></span>
      </button>
    </div>
  </div>
</div>
